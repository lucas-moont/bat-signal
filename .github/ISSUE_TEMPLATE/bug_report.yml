name: Bug
description: Something didn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open Batcave
        2. Start a Claude Code session
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: 'Batcave 0.1.0, Claude Code 2.1.289, Windows 11'
  - type: markdown
    attributes:
      value: '**Do not paste transcript excerpts, prompts, personal paths or tokens.**'
