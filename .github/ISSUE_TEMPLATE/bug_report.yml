name: Bug
description: Algo não funcionou como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abrir a Batcaverna
        2. Iniciar uma sessão do Claude Code
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versões
      placeholder: 'Batcaverna 0.1.0, Claude Code 2.1.289, Windows 11'
  - type: markdown
    attributes:
      value: '**Não cole trechos de transcripts, prompts, caminhos pessoais ou tokens.**'
