name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI builds and checks, and publishes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same checks on both systems Bat-Signal runs on.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # npm's install scripts run next
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Linux app folder, packed as the AppImage packs it.
      - if: runner.os == 'Linux'
        run: npx electron-builder --linux --dir

  # The installer, built and run as a user gets it: install, start, update, uninstall. Beside
  # check, not after it: they share nothing.
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # npm's install scripts run next
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run dist
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/installer-check.ps1
