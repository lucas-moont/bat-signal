name: Release

# A v* tag publishes that version: the Windows installer, the Linux AppImage, their checksums and
# the notes from CHANGELOG.md. Everything is checked first, and a tag with a "-" (v1.0.0-rc.1)
# makes a pre-release. Built only on GitHub's own runners, from the tag, as SignPath
# Foundation requires for signing later.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # It publishes the AppImage too, so it starts once the linux job below has built it.
    needs: linux
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          # The write token reaches only the Publish step, never .git/config, where npm's install
          # scripts and every tool after them could read it.
          persist-credentials: false
          fetch-depth: 0 # the history, to tell whether the tag is on main
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor $env:GITHUB_SHA origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: The tag names the version in package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ("v$($pkg.version)" -cne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME, but package.json says $($pkg.version)" }
          "VERSION=$($pkg.version)" >> $env:GITHUB_ENV
          "PRODUCT=$($pkg.productName)" >> $env:GITHUB_ENV
          # As build.nsis.artifactName and build.appImage.artifactName name them.
          "SETUP=$($pkg.productName)-Setup-$($pkg.version).exe" >> $env:GITHUB_ENV
          "APPIMAGE=$($pkg.productName)-$($pkg.version).AppImage" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The notes, before anything is built
        shell: bash # passes the notes' bytes through as they are
        run: node scripts/release-notes.mts "$VERSION" > release-notes.md
      - run: npm run dist
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/installer-check.ps1
      - name: The AppImage, from the linux job
        uses: actions/download-artifact@v8
        with:
          name: appimage
          path: app/release
      - name: The checksums
        shell: pwsh
        working-directory: app/release
        # LF between the lines, as sha256sum --check reads them on Linux.
        run: |
          $sums = $env:SETUP, $env:APPIMAGE | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $_" }
          $sums -join "`n" | Set-Content SHA256SUMS.txt -NoNewline
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A draft first, made public once all three files are up: a run that fails halfway
        # publishes nothing, and running it again replaces what the last try uploaded.
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = "release/$env:SETUP", "release/$env:APPIMAGE", 'release/SHA256SUMS.txt'
          # One plain argument: splatting a one-item list (@flags) passed it letter by letter.
          $prerelease = if ($env:VERSION.Contains('-')) { '--prerelease' } else { '--prerelease=false' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --draft --title "$env:PRODUCT $env:VERSION" --notes-file release-notes.md $prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'The files did not reach the release.' }
          gh release edit $tag --draft=false

  # The AppImage, built on Linux. It publishes nothing itself: the release job checks everything,
  # then publishes it beside the installer.
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # npm's install scripts run next
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: app/release/*.AppImage
          if-no-files-found: error
          compression-level: 0 # an AppImage is compressed already
